services:
  postgres:
    image: postgres:15-alpine
    container_name: caply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caply
      POSTGRES_PASSWORD: caply_password
      POSTGRES_DB: caply_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caply"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
